[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowcraft-card-video"
version = "1.0.0"
description = "Generate silent YouTube Shorts videos from KnowCraft card folders."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
knowcraft-video = "knowcraft_video.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
